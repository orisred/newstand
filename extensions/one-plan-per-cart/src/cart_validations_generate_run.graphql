query CartValidationsGenerateRunInput {
  cart {
    lines {
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      giftEmail: attribute(key: "Gift recipient email") {
        value
      }
      giftName: attribute(key: "Gift recipient name") {
        value
      }
      giftMessage: attribute(key: "Gift message") {
        value
      }
    }
  }
}
