# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7f0c96d4f07d154d0a5cbedaed311900"
name = "CZ Subs (dev)"
application_url = "https://release-subscriptions.ne-dev.workers.dev"
embedded = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "subscription_contracts/create", "subscription_contracts/update" ]
  uri = "/webhooks/subscription_contracts"

  [[webhooks.subscriptions]]
  topics = [ "subscription_billing_attempts/success", "subscription_billing_attempts/failure", "subscription_billing_attempts/challenged" ]
  uri = "/webhooks/subscription_billing_attempts"

  [[webhooks.subscriptions]]
  topics = [ "customer_payment_methods/create", "customer_payment_methods/update" ]
  uri = "/webhooks/customer_payment_methods"

  [[webhooks.subscriptions]]
  topics = [ "disputes/create" ]
  uri = "/webhooks/disputes"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_customers,write_customers,read_customer_payment_methods,write_own_subscription_contracts,write_orders,write_merchant_managed_fulfillment_orders,write_validations,read_shopify_payments_disputes,read_all_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[build]
automatically_update_urls_on_dev = true
